# Google Cloud Build Pipeline for CivicPulse-BRICS
steps:
  # 1. Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/civicpulse-brics:$COMMIT_SHA', '.']

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/civicpulse-brics:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'civicpulse-brics'
      - '--image'
      - 'gcr.io/$PROJECT_ID/civicpulse-brics:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Mumbai / Delhi region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'

images:
  - 'gcr.io/$PROJECT_ID/civicpulse-brics:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
